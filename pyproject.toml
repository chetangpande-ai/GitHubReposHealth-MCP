[project]
name = "mcp-project1"
version = "0.1.0"
description = "Real-time GitHub repository health assistant using MCP and LangChain"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.0,<2.0",
    "langchain-groq>=1.0.0,<2.0",
    "langchain-mcp-adapters>=0.3.0,<1.0",
    "mcp>=1.29.0,<2.0",
    "python-dotenv>=1.0.0,<2.0",
]

[project.scripts]
github-health-mcp = "github_repo_health.mcp_server:main"
github-health-agent = "github_repo_health.agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/github_repo_health"]
